# Checked by `cargo deny check advisories bans sources` in CI. Licenses are not checked here.

[advisories]
version = 2
# Each ignore names a crate that no release of the dependency pinning it has
# left behind yet. Drop an entry when the pinning crate moves on.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc-macro of netlink-packet-core, reached through iroh's netwatch and netdev; it only expands macros at build time and has no maintained successor in that tree" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 4.2 comes from secret-service 4.0 (keyring's Linux Secret Service backend) and 5.x from zbus 5.19, which ashpd 0.13 pins; both stay until those crates move to a maintained successor" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names comes in with zbus, pinned by ashpd and secret-service as for RUSTSEC-2026-0370" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive comes in with zvariant, pinned as for RUSTSEC-2026-0370" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
