[package]
name = "vnilink-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VideoToolbox H.264 and ScreenCaptureKit for VniLink"
publish = false

[dependencies]
vnilink = { path = "../vnilink" }
vnilink-media = { path = "../vnilink-media" }
vnilink-audio = { path = "../vnilink-audio" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-cf = "=0.11.0"
screencapturekit = { version = "=11.0.0", features = ["macos_14_0"] }
videotoolbox = { version = "=0.21.0", default-features = false, features = ["compression", "decompression"] }
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSDictionary", "NSError", "NSValue", "NSObject", "NSString"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureVideoDataOutput", "AVMediaFormat", "objc2-core-media", "objc2-core-video", "dispatch2"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMFormatDescription", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVPixelBuffer", "CVBuffer", "CVImageBuffer", "CVReturn", "CVBase"] }
dispatch2 = "=0.3.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
opus = "=0.4.0"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std"] }
