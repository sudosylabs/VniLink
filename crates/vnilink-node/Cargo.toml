[package]
name = "vnilink-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vnilink-app = { path = "../vnilink-app" }
napi = { version = "=3.12.2", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[build-dependencies]
napi-build = "=2.4.1"
# Later 6.1.x backends switched to syn 3 while napi-derive 3.6.3 uses syn 2.
napi-derive-backend = "=6.1.2"
