[package]
name = "vnilink-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UniFFI control-plane bindings for the VniLink shared library"
publish = false

[lib]
name = "vnilink_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
vnilink = { path = "../vnilink" }
uniffi = { version = "=0.29.4" }
thiserror = "2"
