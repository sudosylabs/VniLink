[package]
name = "vnilink-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Frame pacing and H.264 Annex-B for VniLink platform adapters"
publish = false

[dependencies]
thiserror = "2"
vnilink = { path = "../vnilink" }

vnilink-rename = { path = "../vnilink-rename" }
shiguredo_libvpx = "=2026.1.0"
shiguredo_aom = "=2026.1.0"

vnilink-hevc = { path = "../vnilink-hevc" }

[dev-dependencies]
# The browser still fixture carries its bytes as base64 in JSON.
base64 = "=0.22.1"
serde_json = "=1.0.151"
# The impaired-network harness reads each core's Files connection paths.
vnilink = { path = "../vnilink", features = ["test-probes"] }

# The impaired-network harness boots each test core inside its own network namespace.
[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "=0.28.0", features = ["sched"] }

# Build against the local Linux libc instead of assuming an Ubuntu prebuilt ABI.
[target.'cfg(target_os = "linux")'.dependencies]
shiguredo_libvpx = { version = "=2026.1.0", features = ["source-build"] }
shiguredo_aom = { version = "=2026.1.0", features = ["source-build"] }

# The upstream AV1 Windows prebuilt is MSVC-only; GNU builds need their own ABI.
[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
shiguredo_aom = { version = "=2026.1.0", features = ["source-build"] }
