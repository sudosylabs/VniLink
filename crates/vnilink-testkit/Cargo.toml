[package]
name = "vnilink-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Engines on one computer, and each service's functional and performance suites"
publish = false

[dependencies]
# The agent's protocol carries file contents as base64 in JSON.
base64 = "=0.22.1"
blake3 = "=1.8.7"
# A relay on this computer for the relay suite (`relay.rs`).
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1.44", features = ["rt-multi-thread"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# Scratch folders made exclusively, private to this user (`Scratch`).
tempfile = "=3.27.0"
# Loopback engines that never reach a relay (`Core::open_direct`).
vnilink = { path = "../vnilink", features = ["test-probes"] }
vnilink-audio = { path = "../vnilink-audio" }
vnilink-log = { path = "../vnilink-log" }
vnilink-media = { path = "../vnilink-media" }

# Suites state the story a service recorded inline (`Traced::story`);
# `UPDATE_EXPECT=1` rewrites a changed one for review.
[dev-dependencies]
expect-test = "=1.5.1"

# The agent opens a scenario's files without following links and ends a
# launched side's process group (`peer::folders`, `peer::scenarios::launch`).
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

# Each platform's own backends, where a suite runs the real one. The agent
# counts a file's names, keeps a launched side in a job object and hears
# Ctrl-C through Windows' own calls.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
vnilink-windows = { path = "../vnilink-windows" }

# The agent that runs a scenario's host half for a suite on another
# computer (`node build/run.ts testkit:agent`).
[[bin]]
name = "vnilink-testkit"
path = "src/bin/vnilink-testkit.rs"

# Each service's performance suite: `node build/run.ts bench:service <service>`.
[[bench]]
name = "files"
harness = false

[[bench]]
name = "desktop"
harness = false

[[bench]]
name = "terminal"
harness = false

[[bench]]
name = "clipboard"
harness = false

[[bench]]
name = "system"
harness = false

[[bench]]
name = "pairing"
harness = false

[[bench]]
name = "camera"
harness = false

[[bench]]
name = "audio"
harness = false

[[bench]]
name = "relay"
harness = false
