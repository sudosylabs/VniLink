[package]
name = "vnilink-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "=1.4.2", features = ["derive"] }
libfuzzer-sys = "=0.4.10"
vnilink = { path = "..", features = ["fuzzing"] }

# Not a member of the repository's workspace: cargo-fuzz builds it with a
# nightly toolchain and sanitizer flags of its own.
[workspace]
members = ["."]

# The repository's patched sources, as its workspace uses them.
[patch.crates-io]
iroh = { path = "../../../vendor/iroh" }
enigo = { path = "../../../vendor/enigo" }
cpal = { path = "../../../vendor/cpal" }

[profile.release]
debug = 1

[[bin]]
name = "control_message"
path = "fuzz_targets/control_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_request"
path = "fuzz_targets/file_request.rs"
test = false
doc = false
bench = false

