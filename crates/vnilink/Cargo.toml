[package]
name = "vnilink"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared control library for the VniLink remote desktop"
publish = false

[features]
# Application tests open a loopback core on a real store and read the
# endpoint-close count. Production builds leave this off.
test-probes = []

[dependencies]
bytes = "=1.12.1"
enigo = "=0.6.1"
iroh = "=1.3.0"
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
n0-future = "=0.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
vnilink-rename = { version = "=0.1.0", path = "../vnilink-rename" }
vnilink-audio = { path = "../vnilink-audio" }
rand = "0.10"
sha2 = "=0.11.0"
blake3 = "=1.8.7"
thiserror = "2"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "=0.14.0"

[target.'cfg(unix)'.dependencies]
portable-pty = "=0.9.0"
nix = { version = "=0.28.0", features = ["fs", "signal", "process", "user"] }
