[package]
name = "vnilink-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "X11 capture, the Wayland portal, and VA-API video for VniLink"
publish = false

[dependencies]
vnilink = { path = "../vnilink" }
vnilink-media = { path = "../vnilink-media" }
x11rb = { version = "=0.14.0", features = ["randr", "xfixes"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "blocking-api"] }
ashpd = { version = "=0.13.13", default-features = false, features = ["screencast", "remote_desktop", "tokio"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "io-util", "sync"] }
futures-util = "=0.3.34"
libva = "=0.1.4"
v4l = "=0.14.0"
jpeg-decoder = { version = "=0.3.2", default-features = false }
pipewire = { version = "=0.10.1", features = ["v1_0_0"] }
# NVENC and CUDA come with NVIDIA's driver: loaded at run time when present.
libloading = "=0.9.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "io-util", "sync"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
vnilink-macos = { path = "../vnilink-macos" }
