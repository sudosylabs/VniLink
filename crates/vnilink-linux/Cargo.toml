[package]
name = "vnilink-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "X11 capture and the Wayland portal session for VniLink"
publish = false

[dependencies]
vnilink-media = { path = "../vnilink-media" }
x11rb = "=0.14.0"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["screencast", "tokio"] }
