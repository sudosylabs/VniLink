# Standalone UniFFI bindings generator used to produce the Swift/C# bindings
# for the native apps. It intentionally pins the same UniFFI version as
# `crates/vnilink-ffi` so generated bindings never drift from the
# scaffolding compiled into the library.
[package]
name = "uniffi-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Binding generation tooling for VniLink"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "=0.29.4", features = ["cli"] }
