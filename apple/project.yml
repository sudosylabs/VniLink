name: VniLink
options:
  deploymentTarget:
    macOS: "15.0"
packages:
  VnilinkCore:
    path: VnilinkCore
targets:
  VniLink:
    type: application
    platform: macOS
    sources:
      - path: VniLink
        excludes: [Resources/Info.plist]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vnilink.app
        PRODUCT_NAME: VniLink
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VniLink/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: VnilinkCore
      - sdk: ServiceManagement.framework
      - sdk: Carbon.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
