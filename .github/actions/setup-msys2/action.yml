name: Set up MSYS2 MinGW-w64
description: >
  The MSYS2 packages build/prerequisites.json lists for the given tasks, installed by
  setup-msys2, its MinGW tools first on PATH, and VNILINK_MSYS_ROOT set to it. Needs Node.js.

inputs:
  tasks:
    description: The tasks the job runs, separated by spaces, as `prerequisites.ts packages` takes them.
    required: true

outputs:
  location:
    description: Where setup-msys2 installed MSYS2.
    value: ${{ steps.msys2.outputs.msys2-location }}

runs:
  using: composite
  steps:
    - name: Read MSYS2 packages
      id: packages
      shell: pwsh
      env:
        TASKS: ${{ inputs.tasks }}
      run: |
        $Packages = (node build/lib/prerequisites.ts packages msys2 @($env:TASKS -split ' ')) -join ' '
        "msys2=$Packages" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
    - name: Install MSYS2 MinGW-w64
      id: msys2
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        install: ${{ steps.packages.outputs.msys2 }}
    # setup-msys2 installs its own MSYS2 (not the runner image's C:\msys64).
    - name: Use that MSYS2
      shell: pwsh
      env:
        MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        "$env:MSYS2_ROOT\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "VNILINK_MSYS_ROOT=$env:MSYS2_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
