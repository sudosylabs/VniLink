name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Windows GNU toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-clang mingw-w64-x86_64-nasm mingw-w64-x86_64-make

      - name: Configure Windows native builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_GENERATOR=MinGW Makefiles" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libxcb1 libxkbcommon0 libsecret-1-0 cmake nasm libclang-dev libva-dev libpipewire-0.3-dev libudev-dev libasound2-dev libdbus-1-dev pkg-config gnome-keyring dbus-x11 xvfb

      - run: npm ci

      - run: npm run check

      - run: cargo fmt --all -- --check

      - name: Test portable video codecs and recording
        run: cargo test --locked -p vnilink-media --lib

      - name: Test native platform adapters
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) cargo test --locked -p vnilink-macos --lib ;;
            Windows) cargo test --locked -p vnilink-windows --lib ;;
            Linux) cargo test --locked -p vnilink-linux --lib ;;
          esac

      - name: Test Rust transport
        run: cargo test --locked --target-dir target/electron -p vnilink-node data::tests

      - name: Test (Linux display and secret service)
        if: runner.os == 'Linux'
        run: |
          eval "$(dbus-launch --sh-syntax)"
          echo "" | gnome-keyring-daemon --daemonize --unlock --components=secrets || true
          xvfb-run -a npm test

      - name: Test (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm test
