name: ci

# A pull request's commits run once, as the pull request; other branches run
# when they reach main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Advisories appear without a commit, so the dependency audit also runs weekly.
  schedule:
    - cron: '17 4 * * 1'

# Jobs read the repository and write nothing; artifacts upload with the run's own token.
permissions:
  contents: read

# A newer push to the same pull request or branch replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Every job installs what build/prerequisites.json lists, runs `npm run doctor`
# to show what the computer has, then the checks and the full suite. Intel
# macOS and Windows on Arm are unsupported; Linux arm64 is unverified.
jobs:
  macos:
    runs-on: macos-26
    # What these computers have, so a test that needs it fails rather than
    # skips when its install breaks.
    env:
      VNILINK_REQUIRE: ffprobe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install FFmpeg
        run: command -v ffprobe || brew install ffmpeg
      # postinstall installs the Rust toolchain rust-toolchain.toml names.
      - run: npm ci
      # The Rust build, vendored codecs included, from the last run with the
      # same toolchain and lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
      - run: npm run doctor -- --require build,test:rust,test:ui
      # The checks, the Rust checks and tests, the build and every test.
      - run: npm run validate
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenarios-macos
          path: .build/test-runs
          if-no-files-found: ignore

  ubuntu:
    runs-on: ubuntu-24.04
    # What these computers have, so a test that needs it fails rather than
    # skips when its install breaks.
    env:
      VNILINK_REQUIRE: ffprobe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          node build/lib/prerequisites.ts packages debian build test:ui test:rust | xargs sudo apt-get install -y --no-install-recommends
      - run: npm ci
      # The Rust build, vendored codecs included, from the last run with the
      # same toolchain and lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ubuntu
      # Ubuntu restricts the user namespaces Chromium's sandbox needs.
      - run: npm run sandbox:linux
      - run: npm run doctor -- --require build,test:rust,test:ui
      - run: npm run check
      - run: npm run check:rust
      - run: npm run test:rust
      - run: npm run build
      - run: npm run test:native
      # No display on the runner: Xvfb, Openbox and a temporary keyring.
      - run: scripts/test.sh
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenarios-ubuntu
          path: .build/test-runs
          if-no-files-found: ignore

  fedora:
    runs-on: ubuntu-24.04
    container:
      image: fedora:43@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
      # An init reaps orphans, as in the Debian image: the job's own PID 1 keeps
      # them as zombies, which still answer kill(pid, 0). Without a GPU every
      # canvas is shared memory until collected, and the unit suite's peak
      # (about 740 MB) outgrows Docker's default, as a desktop's never does.
      options: --shm-size=2g --init
    env:
      # Root in a container: Electron runs without its sandbox, as in the Debian image.
      VNILINK_TEST_CONTAINER: '1'
    steps:
      - name: Install checkout and Node prerequisites
        run: dnf install -y git tar xz
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The job runs as root over a checkout the runner's user owns, which
      # git refuses unless told the folder is trusted; hygiene reads its log.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Fedora packages
        run: node build/lib/prerequisites.ts packages fedora build test:ui test:rust | xargs dnf install -y
      # A pinned rustup, checked against its published hash, rather than whatever the install script fetches.
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSfo rustup-init https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
          echo '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  rustup-init' | sha256sum --check
          chmod +x rustup-init
          ./rustup-init -y --default-toolchain none --profile minimal
          rm rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: npm ci
      # The Rust build, vendored codecs included, from the last run with the
      # same toolchain and lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fedora
      - run: npm run doctor -- --require build,test:rust,test:ui
      - run: npm run check
      - run: npm run check:rust
      - run: npm run test:rust
      - run: npm run build
      - run: npm run test:native
      - run: scripts/test.sh
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenarios-fedora
          path: .build/test-runs
          if-no-files-found: ignore

  windows:
    runs-on: windows-2025
    # What these computers have, so a test that needs it fails rather than
    # skips when its install breaks.
    env:
      VNILINK_REQUIRE: ffprobe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read MSYS2 packages
        id: packages
        shell: pwsh
        run: |
          $Packages = (node build/lib/prerequisites.ts packages msys2 build test:ui test:rust) -join ' '
          "msys2=$Packages" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install MSYS2 MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          install: ${{ steps.packages.outputs.msys2 }}
      # setup-msys2 installs its own MSYS2 (not the runner image's C:\msys64).
      - name: Use that MSYS2
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_ROOT\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VNILINK_MSYS_ROOT=$env:MSYS2_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # The toolchain rust-toolchain.toml names, with its components, before
      # anything runs cargo: an interrupted download can leave one without
      # cargo, so it is checked and tried again.
      - name: Install the Rust toolchain
        shell: pwsh
        run: |
          foreach ($Attempt in 1..3) {
            rustup toolchain install
            if ($LASTEXITCODE -eq 0) { cargo --version }
            if ($LASTEXITCODE -eq 0) { exit 0 }
            rustup toolchain uninstall (rustup show active-toolchain).Split(' ')[0]
          }
          throw 'The Rust toolchain could not be installed.'
      # The Rust build, vendored codecs included, from the last run with the
      # same toolchain and lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
      # npm ci, the doctor, the checks, the Rust checks and tests, and UI tests.
      - name: Test (native Windows environment)
        shell: pwsh
        run: ./scripts/test-windows.ps1 -MsysRoot $env:VNILINK_MSYS_ROOT
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenarios-windows
          path: .build/test-runs
          if-no-files-found: ignore

  # Known vulnerabilities and unwanted sources in what Cargo.lock and package-lock.json pin. It
  # runs apart from the jobs above, so a new advisory does not hide whether the code builds.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit,cargo-deny
      - run: npm audit --audit-level=high
      - run: cargo audit
      - run: cargo deny --locked check advisories bans sources

  # The maintained Debian image the macOS workstation also uses (npm run test:linux).
  linux-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run doctor -- --require test:linux
      - run: npm run test:linux
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenarios-linux-container
          path: .build/linux-validation
          if-no-files-found: ignore

  # Unsigned installers, on main and on request: the release path every OS ships.
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [macos, ubuntu, windows]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          node build/lib/prerequisites.ts packages debian package:installers | xargs sudo apt-get install -y --no-install-recommends
      - name: Read MSYS2 packages
        if: runner.os == 'Windows'
        id: packages
        shell: pwsh
        run: |
          $Packages = (node build/lib/prerequisites.ts packages msys2 package:installers) -join ' '
          "msys2=$Packages" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install MSYS2 MinGW-w64
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          install: ${{ steps.packages.outputs.msys2 }}
      - name: Use that MSYS2
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_ROOT\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VNILINK_MSYS_ROOT=$env:MSYS2_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run doctor -- --require package:installers
      - run: npm run package:installers
      - run: npm run verify:installers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: dist/installers
          if-no-files-found: error
