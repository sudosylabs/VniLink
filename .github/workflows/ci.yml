name: ci

# A pull request's commits run once, as the pull request; other branches run
# when they reach main. Each operating system's suite is a workflow of its
# own (test-*.yml); the dependency audit (supply-chain.yml) and the
# installers (release.yml) run apart from these.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jobs read the repository and write nothing; artifacts upload with the run's own token.
permissions:
  contents: read

# A newer push to the same pull request or branch replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Every job installs what build/prerequisites.json lists, runs `npm run doctor`
# to show what the computer has, then the checks and the full suite. Intel
# macOS and Windows on Arm are unsupported; Linux arm64 is unverified.
jobs:
  macos:
    name: macOS
    uses: ./.github/workflows/test-macos.yml

  linux:
    name: Linux
    uses: ./.github/workflows/test-linux.yml

  windows:
    name: Windows
    uses: ./.github/workflows/test-windows.yml

  linux-container:
    name: Linux container
    uses: ./.github/workflows/test-linux-container.yml
