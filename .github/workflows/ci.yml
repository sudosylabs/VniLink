name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Windows GNU toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-clang mingw-w64-x86_64-nasm mingw-w64-x86_64-make

      - name: Configure Windows native builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_GENERATOR=MinGW Makefiles" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: npm ci
        if: runner.os == 'macOS'

      - run: npm run check
        if: runner.os == 'macOS'

      - run: cargo fmt --all -- --check
        if: runner.os == 'macOS'

      - name: Test Rust crates and native backend
        if: runner.os == 'macOS'
        run: npm run test:rust

      - name: Test (maintained Linux environment)
        if: runner.os == 'Linux'
        run: npm run test:linux

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: npm test

      - name: Test (native Windows environment)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows.ps1

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-${{ matrix.os }}
          path: |
            .build/test-runs
            .build/linux-validation
          if-no-files-found: ignore
