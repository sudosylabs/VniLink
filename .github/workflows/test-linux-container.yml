name: test-linux-container

# The maintained Debian image the macOS workstation also uses
# (npm run test:linux), called by ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-container:
    name: Debian image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm ci
      - run: npm run doctor -- --require test:linux
      - run: npm run test:linux
      - if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: scenarios-linux-container
          path: .build/linux-validation
