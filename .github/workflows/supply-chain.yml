name: supply-chain

# Known vulnerabilities and unwanted sources in what Cargo.lock and
# package-lock.json pin. Advisories appear without a commit, so it also runs
# weekly; it runs apart from ci.yml, so a new advisory does not hide whether
# the code builds.
on:
  push:
    branches: [main]
    paths: [Cargo.lock, package-lock.json, deny.toml, .github/workflows/supply-chain.yml]
  pull_request:
    paths: [Cargo.lock, package-lock.json, deny.toml, .github/workflows/supply-chain.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit,cargo-deny
      - run: npm audit --audit-level=high
      - run: cargo audit
      - run: cargo deny --locked check advisories bans sources
