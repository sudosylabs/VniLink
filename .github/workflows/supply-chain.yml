name: supply-chain

# Known vulnerabilities and unwanted sources in what Cargo.lock and
# package-lock.json pin. Advisories appear without a commit, so it also runs
# weekly; it runs apart from ci.yml, so a new advisory does not hide whether
# the code builds.
on:
  push:
    branches: [main]
    paths: [Cargo.lock, package-lock.json, deny.toml, .github/workflows/supply-chain.yml]
  pull_request:
    paths: [Cargo.lock, package-lock.json, deny.toml, .github/workflows/supply-chain.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-node
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit,cargo-deny
      - run: npm audit --audit-level=high
      - run: cargo audit
      - run: cargo deny --locked check advisories bans sources
